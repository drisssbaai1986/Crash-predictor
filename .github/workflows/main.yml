name: Build Crash Predictor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
with:
  packages: platform-tools
      -
      name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o CrashPredictorAndroid_project.zip -d build-src

      - name: Build APK
        run: |
          cd build-src/CrashPredictorAndroid
          gradle --no-daemon clean assembleDebug

      - name: Check APK
        run: |
          test -f build-src/CrashPredictorAndroid/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Crash-Predictor-APK
          path: build-src/CrashPredictorAndroid/app/build/outputs/apk/debug/app-debug.apk
